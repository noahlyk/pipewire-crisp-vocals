[package]
name = "crisp-vocals"
version = "0.1.0"
edition = "2021"
authors = ["noahlyk <noahlykins@gmail.com>"]
license = "MIT"

[[bin]]
name = "crisp-vocals"
path = "src/main.rs"

[dependencies]
crisp-config = { path = "../crisp-config" }
clap = { version = "4", features = ["derive"] }
pipewire = { version = "0.10.1", features = ["v1_2_0"] }
jack = "0.11.4"
arc-swap = "1"
serde = { version = "1", features = ["derive"] }
ron = "0.8"
notify = { version = "8", default-features = false }
nnnoiseless = "0.5.2"
