# virtual-input + virtual-mic, as a standalone PipeWire *client* process
# (run via `pipewire -c virtual-devices.conf`, not installed into
# /etc/pipewire/pipewire.conf.d/). Loading these as daemon-side conf.d
# modules would make them permanent parts of the system PipeWire daemon --
# they'd hang around for as long as the whole audio server is up, with no
# relationship to this package's systemd unit being started or stopped.
# Running them as their own client process (started/killed alongside
# crisp-vocals/crisp-links by the wrapper script) ties their lifetime to
# the service: the nodes appear when the service starts and vanish the
# moment it stops, same as any other PipeWire client's ports.
#
# Base sections below (context.properties/spa-libs/modules) are the
# standard boilerplate PipeWire ships in /usr/share/pipewire/filter-chain.conf
# for exactly this "run filter-chain/adapter nodes as a client" use case.

context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }

    # virtual-input -- "anything connected" (e.g. the synth) lands here.
    # Was previously a bare `support.null-audio-sink` adapter object (one
    # node, using its automatic monitor_FL/FR mirror as the fan-out) --
    # switched to a filter-chain, matching virtual-mic below, after two
    # problems traced back specifically to the adapter/null-audio-sink
    # path: (1) its node.description gets silently rewritten to
    # "virtual-input Audio/Sink sink" by something downstream of this
    # config (module-adapter's own default-naming, not anything in this
    # file -- filter-chain nodes are never touched this way), and (2) its
    # node genuinely outlives a clean process exit/SIGTERM, unlike a
    # filter-chain's nodes, which tear down correctly on their own. A
    # simple 2-channel passthrough sidesteps both: crisp-links now reads
    # the fan-out from output.virtual-input's capture_FL/FR (its dedicated
    # source half) instead of virtual-input's old self-monitor mirror.
    { name = libpipewire-module-filter-chain
        args = {
            node.name        = "virtual-input"
            node.description = "virtual-input"
            media.class      = "Virtual"

            capture.props = {
                media.class        = "Audio/Sink"
                node.autoconnect   = false
                priority.session   = 0
                priority.driver    = 0
                audio.channels     = 2
                audio.position     = [ FL FR ]
            }

            playback.props = {
                media.class = "Audio/Source"
            }

            filter.graph = {
                inputs  = [ "in1:In" "in2:In" ]
                outputs = [ "outL:Out" "outR:Out" ]

                nodes = [
                    { name = in1  type = builtin label = copy }
                    { name = in2  type = builtin label = copy }

                    { name = outL type = builtin label = copy }
                    { name = outR type = builtin label = copy }
                ]

                links = [
                    { output = "in1:Out" input = "outL:In" }
                    { output = "in2:Out" input = "outR:In" }
                ]
            }
        }
    }

    # virtual-mic -- DOES need to be a genuine Audio/Sink+Audio/Source node
    # pair (not just a sink's monitor) to be reliably selectable as a
    # microphone by apps like Discord/OBS -- a null-sink's monitor isn't
    # always exposed as an input device by app device pickers. So it's a
    # filter-chain (its usual sink+source node pair), a simple 2-channel
    # passthrough; the actual "virtual + voice" mixing happens in
    # crisp-links' wiring (multiple links landing on the same destination
    # port are summed natively by PipeWire), not in any internal graph
    # here.
    { name = libpipewire-module-filter-chain
        args = {
            node.name        = "virtual-mic"
            node.description = "virtual-mic"
            media.class      = "Virtual"

            # capture.props is virtual-mic's *speaker-facing* half (what
            # crisp-vocals/virtual-input write into). It has to be
            # media.class = Audio/Sink to exist at all, which means every
            # output-device picker (GNOME/KDE Sound settings, pavucontrol,
            # wpctl) will list it -- there is no PipeWire property that
            # hides an Audio/Sink node from those, and setting a custom
            # node.description here just gets it echoed twice by some
            # pickers ("virtual-mic (...) [virtual-mic (...) input]"), so
            # leave the name alone. node.autoconnect/priority below are the
            # available mitigation: never auto-picked as the default
            # output, and sorted to the very bottom of any priority-ordered
            # list.
            capture.props = {
                media.class        = "Audio/Sink"
                node.autoconnect   = false
                priority.session   = 0
                priority.driver    = 0
                audio.channels     = 2
                audio.position     = [ FL FR ]
            }

            playback.props = {
                media.class = "Audio/Source"
            }

            filter.graph = {
                inputs  = [ "in1:In" "in2:In" ]
                outputs = [ "outL:Out" "outR:Out" ]

                nodes = [
                    { name = in1  type = builtin label = copy }
                    { name = in2  type = builtin label = copy }

                    { name = outL type = builtin label = copy }
                    { name = outR type = builtin label = copy }
                ]

                links = [
                    { output = "in1:Out" input = "outL:In" }
                    { output = "in2:Out" input = "outR:In" }
                ]
            }
        }
    }
]
