name: Semantic Versioning and Release

on:
  push:
    branches: [main]

jobs:
  check-skip:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check if this is a version bump commit
        id: check
        run: |
          skip=false
          jq -r '.head_commit.message' "$GITHUB_EVENT_PATH" | grep -q "^chore: bump version" && skip=true || true
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  version:
    needs: [check-skip]
    if: needs.check-skip.outputs.should_skip == 'false'
    runs-on: ubuntu-latest
    container: archlinux:latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      old_version: ${{ steps.bump.outputs.old_version }}
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm git
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine version bump
        id: bump
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          OLD_VERSION=${LAST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$OLD_VERSION"

          COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=%s 2>/dev/null || git log HEAD --pretty=%s)

          # Conventional Commits prefixes may carry an optional scope
          # ("fix(devices):") and/or a breaking-change bang ("feat!:") --
          # matching only the bare "fix:"/"feat:" form (as this used to)
          # silently failed to bump the version for any scoped commit,
          # which was every commit here except the very first. Every push
          # already rebuilds and republishes a tarball regardless of
          # message, so default to a patch bump unconditionally and only
          # escalate for feat/breaking -- that way the version can never
          # again silently stay put while real changes ship.
          MINOR_MATCH='^feat(\([^)]*\))?!?:'
          BREAKING_MATCH='^(feat|fix)(\([^)]*\))?!:|^BREAKING CHANGE:'

          PATCH=$((PATCH + 1))
          if echo "$COMMITS" | grep -qE "$MINOR_MATCH"; then
            MINOR=$((MINOR + 1))
            PATCH=0
          fi

          if echo "$COMMITS" | grep -qE "$BREAKING_MATCH"; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "old_version=$OLD_VERSION" >> $GITHUB_OUTPUT
          echo "Bumping $OLD_VERSION -> $NEW_VERSION"

  build:
    needs: [version]
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install system dependencies
        run: pacman -Syu --noconfirm base-devel git rust pipewire jack2 pkgconf clang
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build binaries
        run: cargo build --release --locked
      - name: Determine architecture
        id: arch
        run: |
          ARCH=$(uname -m)
          echo "arch=$ARCH" >> $GITHUB_OUTPUT
          if [ "$ARCH" = "x86_64" ]; then
            echo "arch_name=x86_64" >> $GITHUB_OUTPUT
          elif [ "$ARCH" = "aarch64" ]; then
            echo "arch_name=aarch64" >> $GITHUB_OUTPUT
          fi
      - name: Update PKGBUILD versions
        run: |
          VERSION=${{ needs.version.outputs.new_version }}
          sed -i "s/pkgver=.*/pkgver=$VERSION/" PKGBUILD
          sed -i "s/pkgver=.*/pkgver=$VERSION/" aur/PKGBUILD
      - name: Create tarball
        run: |
          ARCH_NAME=${{ steps.arch.outputs.arch_name }}
          VERSION=${{ needs.version.outputs.new_version }}
          OUT="pipewire-crisp-vocals-${VERSION}-${ARCH_NAME}"
          mkdir -p "$OUT"
          cp target/release/crisp-vocals target/release/crisp-links "$OUT/"
          cp systemd/pipewire-crisp-vocals.service "$OUT/"
          cp config/*.conf config/*.example "$OUT/"
          cp scripts/pipewire-crisp-vocals-wrapper.sh "$OUT/"
          cp README.md ARCHITECTURE.md LICENSE "$OUT/"
          tar -czf "${OUT}.tar.gz" -C "$OUT" .
          sha256sum "${OUT}.tar.gz" > "${OUT}.sha256"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            PKGBUILD
            aur/
            pipewire-crisp-vocals-*.tar.gz
            pipewire-crisp-vocals-*.sha256

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: write
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm git github-cli
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .
      - name: Configure git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          gh auth setup-git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit version bump and tag
        run: |
          VERSION=${{ needs.version.outputs.new_version }}
          git add PKGBUILD aur/
          git commit -m "chore: bump version to v${VERSION}" || echo "No changes to commit"
          git tag "v${VERSION}" -f
          git push origin main
          git push origin "v${VERSION}" -f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create GitHub release
        run: |
          VERSION=${{ needs.version.outputs.new_version }}
          ARCH_NAME=$(uname -m)
          if [ "$ARCH_NAME" = "x86_64" ]; then
            ARCH_NAME="x86_64"
          elif [ "$ARCH_NAME" = "aarch64" ]; then
            ARCH_NAME="aarch64"
          fi
          gh release delete "v${VERSION}" --yes 2>/dev/null || true
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes "Release v${VERSION}" \
            pipewire-crisp-vocals-${VERSION}-${ARCH_NAME}.tar.gz \
            pipewire-crisp-vocals-${VERSION}-${ARCH_NAME}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  aur:
    needs: [version, build, release]
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .
      - name: Push to AUR
        run: |
          VERSION=${{ needs.version.outputs.new_version }}
          pacman -Syu --noconfirm openssh git sudo base-devel

          useradd -m builduser
          echo "builduser ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

          mkdir -p /home/builduser/.ssh
          echo "$AUR_SSH_KEY" > /home/builduser/.ssh/aur
          chmod 600 /home/builduser/.ssh/aur
          chmod 700 /home/builduser/.ssh
          chown -R builduser:builduser /home/builduser/.ssh
          ssh-keyscan aur.archlinux.org >> /home/builduser/.ssh/known_hosts

          cp -r aur /home/builduser/aur
          chown -R builduser:builduser /home/builduser/aur

          sudo -u builduser VERSION="$VERSION" GIT_SSH_COMMAND="ssh -i /home/builduser/.ssh/aur -o StrictHostKeyChecking=no" bash -c '
            cd /home/builduser
            git clone ssh://aur@aur.archlinux.org/pipewire-crisp-vocals.git aur-push 2>&1 || true
            if [ -d "aur-push/.git" ]; then
              echo "Cloned existing AUR repo"
              cd aur-push
              git fetch origin
              git reset --hard origin/master
              cd ..
            else
              echo "Creating new AUR repo (clone failed)"
              mkdir -p aur-push
              cd aur-push
              git init
              git remote add origin ssh://aur@aur.archlinux.org/pipewire-crisp-vocals.git
              cd ..
            fi

            rm -rf aur-push/*
            cp aur/PKGBUILD aur-push/

            cd aur-push
            makepkg --printsrcinfo > .SRCINFO
            git config user.name "GitHub Action"
            git config user.email "action@github.com"
            git add PKGBUILD .SRCINFO
            git commit -m "Update to v${VERSION}" || echo "No changes to commit"
            git push origin master
          '
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
